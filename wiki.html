<head>

<style>
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-ext-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0100-02AF; }
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-ext-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0100-02AF; }
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-900-normal.woff2') format('woff2'); font-weight: 900; font-display: swap; }
@font-face { font-family: 'Sans'; src: url('fonts/roboto-latin-ext-900-normal.woff2') format('woff2'); font-weight: 900; font-display: swap; unicode-range: U+0100-02AF; }
:root { --bg: #0c0507; --panel: #170a0d; --panel2: #1f0d12; --line: #3a1219; --ink: #f4ece6; --muted: #b9a7a2; --red: #e3243b; --gold: #f2c14e; --code: #2a0d13; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 'Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
header.top { padding: 26px 16px 18px; text-align: center; border-bottom: 1px solid var(--line);
  background: radial-gradient(circle at 50% 140%, rgba(227,36,59,.35), transparent 60%), var(--bg); }
.kanji { font-size: 15px; letter-spacing: .4em; color: var(--gold); }
h1 { margin: 4px 0 4px; font-weight: 900; font-size: clamp(28px, 6vw, 46px); letter-spacing: .04em; line-height: 1.05; }
h1 span { color: var(--red); }
.sub { color: var(--muted); margin: 0; }
.sub a { margin-left: 6px; }
nav.tabs { position: sticky; top: 0; z-index: 20; background: rgba(12,5,7,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.tabs .in { max-width: 1180px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
nav.tabs .in::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 8px 13px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
nav.tabs a.on { background: var(--red); color: #fff; }
nav.tabs a:hover:not(.on) { color: var(--ink); background: var(--panel2); }
main { max-width: 1180px; margin: 0 auto; padding: 8px 16px 64px; }
h2 { font-weight: 900; font-size: 26px; margin: 28px 0 6px; }
h2 + p.lead { margin-top: 0; }
h3 { margin: 22px 0 8px; font-size: 19px; }
.lead { color: var(--muted); max-width: 760px; }
.muted { color: var(--muted); }
code { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; background: var(--code); color: var(--gold); padding: 1px 7px; border-radius: 6px; font-size: .9em; overflow-wrap: anywhere; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
.bar input[type=search] { flex: 1 1 220px; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; }
.bar input[type=search]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip.on { border-color: var(--gold); color: var(--ink); background: var(--panel2); }
.count { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px 12px; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s; position: relative; }
.tile:hover, .tile:focus-visible { transform: translateY(-2px); border-color: var(--rc, var(--gold)); outline: none; }
.tile .art { width: 76px; height: 76px; margin: 0 auto 6px; }
.tile b { display: block; font-size: 14px; line-height: 1.25; }
.tile small { display: block; color: var(--rc); font-size: 12px; margin-top: 3px; }
.tile .tag { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--muted); }
.art svg { width: 100%; height: 100%; display: block; }
.cre { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 40px; line-height: 1;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--bgc) 55%, #fff 0%), color-mix(in srgb, var(--bgc) 30%, #0c0507) 70%);
  box-shadow: 0 0 0 3px var(--rc), 0 0 18px color-mix(in srgb, var(--rc) 55%, transparent); }
.cre.evo { box-shadow: 0 0 0 3px var(--rc), 0 0 0 6px rgba(242,193,78,.35), 0 0 22px var(--rc); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 8px; }
.card p { margin: 6px 0; color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 10px; }
.steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 60px; position: relative; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 14px; top: 14px; width: 32px; height: 32px; border-radius: 9px; background: var(--red); color: #fff; font-weight: 900; display: grid; place-items: center; }
.steps b { display: block; }
.steps span { color: var(--muted); }
.mini { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; margin: 3px 4px 3px 0; cursor: pointer; font-size: 13px; color: var(--ink); text-decoration: none; }
.mini .art { display: inline-block; width: 24px; height: 24px; flex: none; }
.mini .cre { font-size: 14px; box-shadow: 0 0 0 2px var(--rc); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
th { background: #1d0b10; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.region { border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--rg) 22%, var(--panel)), var(--panel) 55%); padding: 16px 18px; }
.region h3 { margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.region .lv { color: var(--rg); font-weight: 900; font-size: 15px; white-space: nowrap; }
.region h4 { margin: 12px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.faq details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
.faq summary { cursor: pointer; font-weight: 700; }
.faq p { color: var(--muted); margin: 8px 0 0; }
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.65); }
.dlg { padding: 20px 20px 18px; }
.dlg .hd { display: flex; gap: 16px; align-items: center; }
.dlg .hd .art { width: 96px; height: 96px; flex: none; }
.dlg h3 { margin: 0; font-size: 22px; }
.dlg .meta { color: var(--rc); font-weight: 700; font-size: 14px; }
.dlg ul { padding-left: 18px; color: var(--ink); }
.dlg li { margin: 4px 0; }
.dlg .x { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 26px; cursor: pointer; line-height: 1; }
.stat { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 13px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
footer { margin-top: 40px; color: var(--muted); font-size: 14px; text-align: center; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); } .tile .art { width: 62px; height: 62px; } .steps li { padding-left: 56px; } }
</style>
</head>

    if (has(it, 'tas', 'parcasi', 'lav')) return '<path d="M12 46 L18 26 L32 18 L46 24 L52 42 L40 50 L20 52 Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/><path d="M18 26 L32 18 L34 32 L22 38 Z" fill="' + h + '" opacity=".6"/>';
    return '<path d="M32 10 L50 24 L44 50 H20 L14 24 Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/><path d="M14 24 H50 L32 50 Z" fill="' + h + '" opacity=".45"/>';
  }
  function itemArt(it) {
    const c = colorOf(it);
    const d = shade(c, -0.45);
    const h = shade(c, 0.45);
    const rc = RC(it.r);
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#1b0c10" stroke="' + rc + '" stroke-width="2.5"/><circle cx="32" cy="34" r="24" fill="' + rc + '" opacity=".14"/>' + shape(it, c, d, h) + '</svg>';
  }
  function creArt(c) {
    return '<div class="cre' + (c.w ? '' : ' evo') + '" style="--bgc:' + REG[c.reg].col + ';--rc:' + RC(c.r) + '"><span>' + c.i + '</span></div>';
  }
  const miniItem = (id, q) => { const it = IT[id]; return it ? '<a class="mini" href="#esya/' + id + '" style="--rc:' + RC(it.r) + '"><span class="art">' + itemArt(it) + '</span>' + esc(it.n) + (q ? ' ×' + q : '') + '</a>' : ''; };
  const miniCre = (id) => { const c = CR[id]; return c ? '<a class="mini" href="#yaratik/' + id + '" style="--rc:' + RC(c.r) + '"><span class="art">' + creArt(c) + '</span>' + esc(c.n) + '</a>' : ''; };

  // ───────── Sayfalar ─────────
  const TABS = [
    ['baslangic', '🏯 Nasıl oynanır'], ['komutlar', '⌨️ Komutlar'], ['yaratiklar', '🐉 Yaratıklar'], ['esyalar', '🎒 Eşyalar'], ['tarifler', '🔨 Tarifler'],
    ['bolgeler', '🗺️ Bölgeler'], ['meslekler', '🧭 Meslekler'], ['zindanlar', '🏰 Zindan & Raid'], ['ilerleme', '📈 İlerleme'], ['sss', '❓ SSS'],
  ];
  const state = { q: {}, f: {} };

  function pageBaslangic() {
    const R = D.rules;
    return '<h2>Nasıl oynanır?</h2><p class="lead">SAMURAI WORLD, Kick chat\'inden komut yazarak oynanan bir samuray MMORPG\'si. Hiçbir şey indirmen ya da bir siteye üye olman gerekmez: chat\'e yazdığın ilk oyun komutu karakterini oluşturur ve ilerlemen Kick hesabına kayıtlı kalır.</p>' +
      '<h3>İlk 10 dakika</h3><ol class="steps">' +
      '<li><b>Chat\'e <code>!yakala</code> yaz</b><span>Karakterin oluşur: ' + R.start.gold + ' altın, 2 Sağlık İksiri, Taş Kazma, Bambu Olta, Taş Balta ve Kısa Yay ile Başlangıç Köyü\'ndesin. İlk yaratığını da yakalamaya çalışırsın.</span></li>' +
      '<li><b><code>!kes</code> ile savaş</b><span>Bölgedeki bir yaratıkla savaşırsın; kazanınca EXP, altın ve malzeme gelir. Canın azalırsa <code>!iyiles</code>. Yenilirsen sadece ' + R.ko + ' sn baygın kalırsın, hiçbir şey kaybetmezsin.</span></li>' +
      '<li><b>Kaynak topla</b><span><code>!maden</code> <code>!balik</code> <code>!odun</code> <code>!topla</code> <code>!av</code> — her birinin kendi mesleği var ve kullandıkça gelişir.</span></li>' +
      '<li><b>Üret ve kuşan</b><span><code>!erit bakir</code> ile külçe, <code>!uret Bakır Hançer</code> ile silah yap, <code>!giy Bakır Hançer</code> ile kuşan. Neler yapabileceğini <code>!tarifler</code> gösterir.</span></li>' +
      '<li><b>Görevlerini yap</b><span><code>!gorevler</code> her gün 3 görev verir; bitirdikçe ödül anında gelir. Seviye 5\'te <code>!git Kızıl Orman</code> ile yeni bölgeye geç.</span></li></ol>' +
      '<h3>Oyun nasıl ilerler?</h3><div class="cards">' +
      card('⚔️ Seviye ve güç', 'Her şey EXP verir. Seviye atladıkça canın, saldırın ve savunman artar; yeni bölgeler (Sv 5, 10, 15 … 90) ve zindanlar açılır. Ekipman gücünü belirler: <code>!profil</code> ile bak.') +
      card('🧭 Meslekler', '10 meslek ayrı ayrı gelişir. Yüksek meslek + daha iyi alet = daha nadir cevher, balık, odun ve av. Ayrıntı: <a href="#meslekler">Meslekler</a>') +
      card('🔨 Üretim zinciri', 'Cevher → <code>!erit</code> → külçe → <code>!uret</code> → silah/zırh/alet. Daha güçlü eşyalar daha nadir malzeme ister. <a href="#tarifler">Tüm tarifler</a>') +
      card('🐉 Koleksiyon', D.creatures.filter((c) => c.w).length + ' yaratık türü 6 nadirlikte. Yakaladıkların koleksiyonuna girer; birini <code>!yoldas</code> yaparsan seninle savaşır ve güçlenir. <a href="#yaratiklar">Tüm yaratıklar</a>') +
      card('🏰 Zindan & dünya boss\'u', 'Zindanlarda dalgaları ve boss\'u yenip özel ganimet toplarsın; parti kurarsan arkadaşların seninle girer. Dünya boss\'u belirince herkes <code>!raid</code> ile birlikte saldırır. <a href="#zindanlar">Ayrıntı</a>') +
      card('📈 Uzun vadeli hedefler', 'Başarımlar ve unvanlar, ekipmanı +10\'a geliştirme, yaratık evrimi, klanlar ve Sv 100\'de prestij. <a href="#ilerleme">İlerleme sistemleri</a>') +
      '</div><h3>Bilmen gerekenler</h3><div class="cards">' +
      card('⏳ Bekleme süreleri', 'Komutların kişiye özel bekleme süresi var (ör. <code>!kes</code> ' + R.cd.kes + ' sn, <code>!maden</code> ' + R.cd.maden + ' sn). Spam işe yaramaz; <code>!durum</code> ne zaman hazır olduğunu söyler.') +
      card('💎 Abone bonusu', 'Kanal aboneleri karakter ve meslek EXP\'sini ×1.3, 6 ay ve üzeri aboneler ×1.5 kazanır. Altın ve eşyalar herkes için aynıdır.') +
      card('✅ Onay', 'Değerli bir satış, verme, evrim ya da prestij gibi işlemler <code>!onay</code> ister; yanlışlıkla bir şey kaybetmezsin.') +
      card('🌍 Dünya olayları', 'Oyuncular aktifken ara ara 10 dakikalık olaylar başlar: ' + D.events.map((e) => e.icon + ' ' + esc(e.name)).join(', ') + '. Chat\'te duyurulur; <code>!olay</code> ile bak.') +
      '</div>';
  }
  const card = (t, html) => '<section class="card"><h3>' + t + '</h3><p>' + html + '</p></section>';

  const GROUPS = [
    ['Karakter', ['lvl', 'profil', 'istatistik', 'meslekler', 'durum', 'para', 'top', 'yardim']],
    ['Yaratık ve savaş', ['yakala', 'kes', 'iyiles', 'koleksiyon', 'yaratik', 'yoldas', 'besle', 'evrim']],
    ['Toplama ve avcılık', ['maden', 'balik', 'odun', 'topla', 'av', 'izsur', 'tuzak', 'kaynaklar']],
    ['Envanter ve ekipman', ['envanter', 'cevher', 'esya', 'ekipman', 'giy', 'cikar', 'kullan', 'gelistir', 'tamir', 'at']],
    ['Üretim', ['erit', 'uret', 'tarifler', 'tarif']],
    ['Ticaret', ['magaza', 'al', 'sat', 'ver', 'onay', 'pazar', 'pazarsat', 'pazaral', 'pazargeri', 'pazarim', 'takas', 'takaskabul', 'takasred']],
    ['Dünya', ['harita', 'bolge', 'git', 'zindan', 'raid', 'olay', 'tuccar', 'tuccaral']],
    ['Hedefler ve sosyal', ['gorevler', 'basarimlar', 'unvanlar', 'unvan', 'parti', 'klan', 'klanlar', 'prestij']],
  ];
  function pageKomutlar() {
    const C = Object.fromEntries(D.commands.map((c) => [c.k, c]));
    const q = norm(state.q.cmd || '');
    const rows = GROUPS.map(([g, ks]) => {
      const list = ks.map((k) => C[k]).filter((c) => c && (!q || norm(c.k + ' ' + c.h + ' ' + c.a.join(' ')).includes(q)));
      if (!list.length) return '';
      return '<h3>' + g + '</h3><div class="tablewrap"><table><thead><tr><th>Komut</th><th>Ne yapar</th><th>Diğer yazımlar</th></tr></thead><tbody>' +
        list.map((c) => '<tr><td><code>!' + c.k + (c.args ? ' ' + esc(c.args) : '') + '</code></td><td>' + esc(c.h) + '</td><td class="muted">' + c.a.slice(0, 4).map((a) => '!' + a).join(' ') + '</td></tr>').join('') + '</tbody></table></div>';
    }).join('');
    return '<h2>Komutlar</h2><p class="lead">Büyük/küçük harf ve Türkçe karakter fark etmez: <code>!yardım</code> = <code>!yardim</code>. Chat\'te kısa liste için <code>!yardim</code>, yeni sistemler için <code>!yardim yeni</code>.</p>' +
      '<div class="bar"><input type="search" placeholder="Komut ara… (ör. pazar, zindan)" data-q="cmd" value="' + esc(state.q.cmd || '') + '"></div>' + (rows || '<div class="empty">Sonuç yok</div>') +
      '<h3>Yayındaki diğer oyunlar</h3><div class="cards">' + card('👹 Boss Raid', '<code>!vur</code> boss ekrandayken saldırır, <code>!boss</code> kaç abone kaldığını, <code>!bossrank</code> en çok hasar verenleri gösterir. Boss\'a katılanlar burada da EXP ve altın kazanır.') + card('⚔️ Düello', '<code>!vs kullanıcı</code> ile düelloya çağır, o <code>!kabul</code> yazınca savaş ekranda oynar. <code>!top5</code> en çok kazananlar.') + card('✊ Taş · Kâğıt · Makas', '<code>!tkm kullanıcı</code> ile meydan oku, o <code>!kabul</code> yazınca hamleleri kader seçer. Beraberlikte otomatik yeni tur; kazanan hamle ekranda kaybedeni gerçekten yener: taş makası kırar, makas kâğıdı keser, kâğıt taşı sarar.') + '</div>';
  }

  function filterChips(key, opts, all = 'Tümü') {
    const cur = state.f[key] ?? '';
    return '<div class="chips">' + [['', all], ...opts].map(([v, l]) => '<button class="chip' + (String(cur) === String(v) ? ' on' : '') + '" data-f="' + key + '" data-v="' + esc(v) + '">' + l + '</button>').join('') + '</div>';
  }
  const rarityChips = (key) => filterChips(key, D.rarity.map((r, i) => [String(i), '<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + r.col + ';margin-right:5px"></i>' + r.n]), 'Tüm nadirlikler');

  function pageYaratiklar() {
    const q = norm(state.q.cre || '');
    const fr = state.f.creR ?? '';
    const fg = state.f.creG ?? '';
    const list = D.creatures.filter((c) => (!q || norm(c.n + ' ' + c.t).includes(q)) && (fr === '' || String(c.r) === fr) && (fg === '' || (fg === 'evo' ? !c.w : String(c.reg) === fg)));
    return '<h2>Yaratıklar</h2><p class="lead">' + D.creatures.filter((c) => c.w).length + ' tür doğada yaşar, ' + D.creatures.filter((c) => !c.w).length + ' tür yalnızca evrimle elde edilir (altın halkalı). Bir karta tıklayınca nerede yaşadığı, ne düşürdüğü ve nasıl evrimleştiği açılır.</p>' +
      '<div class="bar"><input type="search" placeholder="Yaratık ara…" data-q="cre" value="' + esc(state.q.cre || '') + '"></div>' +
      filterChips('creG', [...REG.map((r, i) => [String(i), r.i + ' ' + r.n]), ['evo', '🧬 Evrim formları']], 'Tüm bölgeler') + '<div style="height:8px"></div>' + rarityChips('creR') +
      '<p class="count">' + list.length + ' yaratık</p><div class="grid">' + list.map((c) => '<button class="tile" data-open="yaratik/' + c.id + '" style="--rc:' + RC(c.r) + '"><div class="art">' + creArt(c) + '</div><b>' + esc(c.n) + '</b><small>' + D.rarity[c.r].n + ' · Sv ' + c.lv[0] + '–' + c.lv[1] + '</small></button>').join('') + '</div>';
  }

  function pageEsyalar() {
    const q = norm(state.q.item || '');
    const fc = state.f.itemC ?? '';
    const fr = state.f.itemR ?? '';
    const list = D.items.filter((it) => (!q || norm(it.n).includes(q)) && (fc === '' || it.c === fc) && (fr === '' || String(it.r) === fr)).sort((a, b) => a.c.localeCompare(b.c) || a.r - b.r || a.p - b.p);
    return '<h2>Eşyalar</h2><p class="lead">Oyundaki ' + D.items.length + ' eşyanın tamamı. Kartlara tıklayınca nereden bulunduğu, ne işe yaradığı ve hangi tariflerde kullanıldığı açılır. Çerçeve rengi nadirliği gösterir.</p>' +
      '<div class="bar"><input type="search" placeholder="Eşya ara… (ör. katana, koi, iksir)" data-q="item" value="' + esc(state.q.item || '') + '"></div>' +
      filterChips('itemC', Object.entries(D.cats).map(([k, v]) => [k, v]), 'Tüm türler') + '<div style="height:8px"></div>' + rarityChips('itemR') +
      '<p class="count">' + list.length + ' eşya</p><div class="grid">' + list.map((it) => '<button class="tile" data-open="esya/' + it.id + '" style="--rc:' + RC(it.r) + '" title="' + esc(D.cats[it.c]) + '"><div class="art">' + itemArt(it) + '</div><b>' + esc(it.n) + '</b><small>' + D.rarity[it.r].n + (it.lvl ? ' · Sv ' + it.lvl : '') + '</small></button>').join('') + '</div>';
  }

  function pageTarifler() {
    const q = norm(state.q.rec || '');
    const fp = state.f.recP ?? '';
    const list = D.recipes.filter((r) => (fp === '' || (fp === 'erit' ? r.st === 'erit' : r.pr === fp && r.st === 'uret')) && (!q || norm(IT[r.out].n + ' ' + r.m.map(([m]) => IT[m].n).join(' ')).includes(q))).sort((a, b) => a.lvl - b.lvl);
    const profs = [['erit', '🔥 Eritme'], ...['demircilik', 'zanaat', 'simya'].map((k) => [k, PROF[k].i + ' ' + PROF[k].n])];
    return '<h2>Tarifler</h2><p class="lead">Eritme <code>!erit</code>, diğer her şey <code>!uret</code> ile yapılır. Tarifin mesleği yeterli seviyede olmalı. Üretmek mesleğini geliştirir.</p>' +
      '<div class="bar"><input type="search" placeholder="Tarif ya da malzeme ara…" data-q="rec" value="' + esc(state.q.rec || '') + '"></div>' + filterChips('recP', profs) +
      '<p class="count">' + list.length + ' tarif</p><div class="tablewrap"><table><thead><tr><th>Ürün</th><th>Meslek</th><th>Malzemeler</th></tr></thead><tbody>' +
      list.map((r) => '<tr><td>' + miniItem(r.out, r.q > 1 ? r.q : 0) + '</td><td>' + (r.st === 'erit' ? '🔥 Eritme' : PROF[r.pr].i + ' ' + PROF[r.pr].n) + ' ' + r.lvl + '</td><td>' + r.m.map(([m, q2]) => miniItem(m, q2)).join('') + '</td></tr>').join('') + '</tbody></table></div>';
  }

  const SK = { maden: ['⛏️', 'Madencilik', '!maden'], balik: ['🎣', 'Balıkçılık', '!balik'], odun: ['🪓', 'Odunculuk', '!odun'], topla: ['🌿', 'Toplayıcılık', '!topla'], av: ['🏹', 'Avcılık', '!av'] };
  function pageBolgeler() {
    return '<h2>Bölgeler</h2><p class="lead">' + REG.length + ' bölge, seviye arttıkça açılır. <code>!git bölge</code> ile seyahat edersin (yukarı doğru küçük bir ücreti var, köye dönüş ücretsiz). Yeni bir bölgeyi ilk keşfetmek EXP verir.</p><div class="cards">' +
      REG.map((r, i) => '<section class="region" style="--rg:' + r.col + '"><h3><span>' + r.i + ' ' + esc(r.n) + '</span><span class="lv">Sv ' + r.lvl + '+</span></h3>' +
        '<h4>Yaratıklar</h4>' + r.cr.map(miniCre).join('') +
        r.res.filter(([, l]) => l.length).map(([sk, l]) => '<h4>' + SK[sk][0] + ' ' + SK[sk][2] + '</h4>' + l.map((x) => miniItem(x)).join('')).join('') +
        (r.dg.length ? '<h4>Zindan</h4>' + r.dg.map((id) => { const d = D.dungeons.find((x) => x.id === id); return '<a class="mini" href="#zindanlar">' + d.i + ' ' + esc(d.n) + ' (Sv ' + d.lvl + ')</a>'; }).join('') : '') +
        '<p class="muted" style="margin:10px 0 0">Gitmek: <code>!git ' + esc(r.n) + '</code>' + (r.travel ? ' · köyden ' + r.travel + ' altın' : '') + '</p></section>').join('') + '</div>';
  }

  function pageMeslekler() {
    const how = {
      savas: 'Yaratıklarla savaştıkça (<code>!kes</code>) gelişir. Kritik vuruş şansını artırır.',
      yakalama: '<code>!yakala</code> ile gelişir. Her seviye yakalama şansını biraz artırır.',
      madencilik: '<code>!maden</code> ile gelişir. Yüksek seviye ve iyi kazma nadir cevherleri açar.',
      balikcilik: '<code>!balik</code> ile gelişir. Yüksek seviye ve iyi olta nadir balıkları açar.',
      odunculuk: '<code>!odun</code> ile gelişir. Yüksek seviye ve iyi balta nadir odunları açar.',
      toplayicilik: '<code>!topla</code> ile gelişir. Alet gerekmez; seviye nadir bitkileri açar.',
      demircilik: 'Eritme ve demirci tarifleri (silah, alet, zırh, geliştirme taşı) ile gelişir. Tamir ücretini de düşürür.',
      zanaat: 'Deri, kumaş, aksesuar, yay, olta ve çanta tarifleri ile gelişir.',
      simya: 'İksir, yemek, yem ve Evrim Taşı tarifleri ile gelişir.',
      avcilik: '<code>!av</code>, <code>!izsur</code> ve <code>!tuzak</code> ile gelişir. Yüksek seviye ve iyi yay nadir avları açar.',
    };
    const toolOf = { madencilik: 'kazma', balikcilik: 'olta', odunculuk: 'balta', avcilik: 'yay' };
    return '<h2>Meslekler</h2><p class="lead">10 meslek karakter seviyenden bağımsız gelişir (en çok 100). <code>!meslekler</code> hepsini gösterir.</p><div class="cards">' +
      D.professions.map((p) => {
        const tools = toolOf[p.id] ? D.items.filter((it) => it.tool === toolOf[p.id]).sort((a, b) => a.tier - b.tier) : [];
        const recs = D.recipes.filter((r) => r.pr === p.id).sort((a, b) => a.lvl - b.lvl);
        return '<section class="card"><h3>' + p.i + ' ' + esc(p.n) + '</h3><p>' + how[p.id] + '</p>' +
          (tools.length ? '<p><b style="color:var(--ink)">Aletler (kademe sırasıyla):</b><br>' + tools.map((t) => miniItem(t.id)).join('') + '</p>' : '') +
          (recs.length ? '<p><b style="color:var(--ink)">Örnek tarifler:</b><br>' + recs.filter((_, i) => i % Math.max(1, Math.ceil(recs.length / 6)) === 0).slice(0, 6).map((r) => miniItem(r.out)).join('') + '</p>' : '') + '</section>';
      }).join('') + '</div>';
  }

  function pageZindanlar() {
    const R = D.rules;
    return '<h2>Zindanlar</h2><p class="lead">Zindanın bölgesine git ve <code>!zindan ad</code> yaz. Bir <b>Zindan Anahtarı</b> harcanır (mağaza ya da <code>!uret Zindan Anahtarı</code>). Üç dalga yaratık ve bir boss vardır; can bir sonraki savaşa taşınır. Partin (aynı bölgedeki üyeler) seninle birlikte girer ve herkes ayrı ödül alır. Girişten sonra ' + R.dungeon.cooldownMin + ' dakika dinlenmen gerekir. Yenilirsen sadece baygın kalırsın.</p>' +
      '<div class="cards">' + D.dungeons.map((d) => '<section class="card"><h3>' + d.i + ' ' + esc(d.n) + '</h3><p>' + esc(REG[d.reg].n) + ' · <b style="color:var(--gold)">Sv ' + d.lvl + '+</b> · ödül ~' + fmt(d.gold) + ' altın, ' + fmt(d.xp) + ' EXP</p>' +
        '<p><b style="color:var(--ink)">Dalgalar:</b><br>' + d.waves.map(miniCre).join('') + '</p><p><b style="color:var(--ink)">Boss:</b> ' + d.boss.icon + ' ' + esc(d.boss.name) + ' (Sv ' + d.boss.lvl + ')</p>' +
        '<p><b style="color:var(--ink)">Ganimet:</b><br>' + d.loot.map(([id, ch]) => miniItem(id) ).join('') + '</p><p><b style="color:var(--ink)">Özel ganimet (%' + d.rare[1] + '):</b><br>' + miniItem(d.rare[0]) + '</p></section>').join('') + '</div>' +
      '<h2>Dünya boss\'u</h2><p class="lead">Dünya olaylarında belirir ve ' + R.raid.minutes + ' dakika kalır. Herkes <code>!raid</code> ile saldırır; boss da karşılık verir. Boss yenilince her katılımcı verdiği hasara göre EXP, altın ve ganimet alır, son vuruşu yapan bonus kazanır. Süre biterse boss kaçar ama katılanlar teselli ödülü alır. Hangi boss\'un geleceği aktif oyuncuların ortalama seviyesine bağlıdır.</p><div class="cards">' +
      D.raids.map((b) => '<section class="card"><h3>' + b.i + ' ' + esc(b.n) + '</h3><p>Ortalama seviye ' + b.min + '+ olunca</p><p>' + b.loot.map((x) => miniItem(x)).join('') + '</p></section>').join('') + '</div>' +
      '<h2>Dünya olayları</h2><p class="lead">Oyuncular aktifken her ' + R.events.minGapMin + '–' + R.events.maxGapMin + ' dakikada bir rastgele bir olay başlar ve ' + R.events.durationMin + ' dakika sürer.</p><div class="cards">' +
      D.events.map((e) => card(e.icon + ' ' + esc(e.name), esc(e.desc[0].toLocaleUpperCase('tr-TR') + e.desc.slice(1)) + '.')).join('') + '</div>' +
      '<h3>🧳 Gezgin Tüccar\'ın getirebildikleri</h3><p>' + D.trader.map((t) => miniItem(t.item) + '<span class="muted" style="margin-right:10px">' + fmt(t.buy) + ' altın</span>').join('') + '</p>';
  }

  function pageIlerleme() {
    const R = D.rules;
    const up = R.upgrade;
    return '<h2>İlerleme sistemleri</h2>' +
      '<h3>📋 Görevler</h3><p class="lead">Her gün 3 günlük, her hafta 3 haftalık görev gelir (İstanbul saatiyle gece yarısı ve pazartesi yenilenir). Görevler kişiye özel seçilir; bitince EXP ve altın anında gelir, günün üçünü bitirince bonus ve Geliştirme Taşı, haftalık görevler ayrıca Geliştirme Taşı verir. <code>!gorevler</code></p>' +
      '<div class="tablewrap"><table><thead><tr><th>Görev türü</th><th>Günlük</th><th>Haftalık</th></tr></thead><tbody>' + D.quests.map((q) => '<tr><td>' + esc(q.k) + '</td><td>' + esc(q.d || '—') + '</td><td>' + esc(q.w) + '</td></tr>').join('') + '</tbody></table></div>' +
      '<h3>🏅 Başarımlar ve unvanlar</h3><p class="lead">' + D.ach.length + ' başarım var; her biri altın verir, çoğu bir unvan açar. Unvanı <code>!unvan ad</code> ile takarsın, profilinde adının önünde görünür.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Başarım</th><th>Nasıl</th><th class="num">Altın</th><th>Unvan</th></tr></thead><tbody>' + D.ach.map((a) => '<tr><td style="color:' + D.rarity[a.r].col + '"><b>' + esc(a.n) + '</b></td><td>' + esc(a.d) + '</td><td class="num">' + fmt(a.g) + '</td><td>' + (a.t ? '【' + esc(a.t) + '】' : '<span class="muted">—</span>') + '</td></tr>').join('') + '</tbody></table></div>' +
      '<h3>🔨 Ekipman geliştirme</h3><p class="lead">Kuşandığın eşyayı <code>!gelistir silah</code> (ya da govde, baslik…) ile +1 yaparsın; her seviye eşyanın değerlerini yaklaşık %7 artırır. +' + up.dropFrom + ' ve üstündeki başarısız denemeler eşyayı bir seviye düşürür; çantanda <b>Koruma Tılsımı</b> varsa düşmez. Geliştirilmiş eşya başkasına verilemez.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Hedef</th><th class="num">Başarı şansı</th><th>Gereken taş</th><th>Başarısızlıkta</th></tr></thead><tbody>' + up.chance.map((ch, i) => '<tr><td>+' + (i + 1) + '</td><td class="num">%' + ch + '</td><td>' + Object.entries(up.stones[i]).map(([m, q]) => miniItem(m, q)).join('') + '</td><td>' + (i + 1 >= up.dropFrom ? '1 seviye düşer' : 'seviye korunur') + '</td></tr>').join('') + '</tbody></table></div>' +
      '<p class="muted">Ayrıca altın gerekir (eşyanın değeri × 0.3 × hedef seviye). Savaştıkça ekipman aşınır; dayanıklılık %0 olursa eşya kırılır ve yarı güç verir. <code>!tamir</code> altınla düzeltir, demircilik seviyen ücreti düşürür.</p>' +
      '<h3>🐾 Yoldaş ve evrim</h3><p class="lead">Koleksiyonundaki bir türü <code>!yoldas Kızıl Kurt</code> ile yanına alırsın. Yoldaşın savaştıkça ve <code>!besle</code> ile (balık, av eti, bitki, yemek) seviye atlar (en çok ' + R.pet.max + ') ve sana ATK, DEF ve can verir; nadir türler daha çok verir. Bazı türler evrimleşir: aynı türden yeterli kopya + yoldaş seviyesi + Evrim Taşı → doğada bulunmayan güçlü bir form.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Tür</th><th>Evrim</th><th class="num">Kopya</th><th class="num">Yoldaş Sv</th><th class="num">Evrim Taşı</th></tr></thead><tbody>' + D.evolutions.map((e) => '<tr><td>' + miniCre(e.from) + '</td><td>' + miniCre(e.to) + '</td><td class="num">' + e.copies + '</td><td class="num">' + e.lvl + '</td><td class="num">' + e.stones + '</td></tr>').join('') + '</tbody></table></div>' +
      '<h3>👥 Parti ve klan</h3><div class="cards">' +
      card('Parti', '<code>!parti davet @arkadaş</code> → arkadaşın <code>!parti katil</code>. En çok ' + R.party.max + ' kişi. Son 15 dakikada aktif her üye için +%' + Math.round(R.party.xpBonusPerMember * 100) + ' EXP, zindanlara birlikte girersiniz. <code>!parti ayril</code>') +
      card('Klan', '<code>!klan kur ad</code> (Sv ' + R.guild.createLevel + ', ' + fmt(R.guild.createCost) + ' altın). Lider <code>!klan davet @kişi</code>, davetli <code>!klan katil</code>. <code>!klan bagis N</code> kasaya altın ekler; klan seviye atlar (en çok ' + R.guild.maxLevel + ') ve her seviye tüm üyelere +%1 EXP verir. En fazla ' + R.guild.maxMembers + ' üye.') +
      card('Klan seviyeleri', R.guild.bank.map((b, i) => 'Sv ' + (i + 2) + ': ' + fmt(b)).join(' · ') + ' altın (toplam bağış)') +
      '</div><h3>🏪 Pazar ve takas</h3><div class="cards">' +
      card('Oyuncu pazarı', '<code>!pazarsat Kurt Dişi 5 12</code> → 5 adet, tanesi 12 altın. Eşya ilan süresince emanette durur. İlan ücreti %' + Math.round(R.market.listFeeFrac * 100) + ', satıştan %' + Math.round(R.market.taxFrac * 100) + ' vergi kesilir; para çevrimdışıyken bile hesabına geçer. İlan ' + R.market.expireDays + ' gün kalır, sonra çantana döner. Satın almak: <code>!pazar</code> → <code>!pazaral #no</code>') +
      card('Takas', '<code>!takas @kişi Kurt Dişi 5 karşılığında altın 200</code>. Karşı taraf ' + R.market.offerSeconds + ' saniye içinde <code>!takaskabul</code> ya da <code>!takasred</code> yazar. Kabul anında iki tarafın da elinde olanlar yeniden kontrol edilir; ya ikisi birden değişir ya hiçbiri.') +
      card('Kurallar', 'Pazar, takas ve <code>!ver</code> için seviye ' + R.giftLevel + ' gerekir. Değerli işlemler <code>!onay</code> ister. NPC mağazasında alış fiyatı her zaman satıştan yüksektir, yani al-sat ile altın üretilemez.') +
      '</div><h3>✦ Prestij</h3><p class="lead">Seviye ' + R.maxLevel + '\'e ulaşınca <code>!prestij</code> yazabilirsin: seviyen 1\'e döner ve Başlangıç Köyü\'ne dönersin, ama eşyaların, altının, mesleklerin ve koleksiyonun kalır. Her prestij kalıcı olarak +%' + Math.round(R.prestige.xpBonus * 100) + ' EXP ve +%' + Math.round(R.prestige.statBonus * 100) + ' istatistik verir ve “Prestij N” unvanını açar (en çok ' + R.prestige.max + ').</p>';
  }

  function pageSss() {
    const Q = [
      ['Oynamak için bir şey indirmem ya da üye olmam gerekiyor mu?', 'Hayır. Yayın sırasında Kick chat\'ine bir oyun komutu yazman yeterli; karakterin ilk komutta otomatik oluşur.'],
      ['İlerlemem silinir mi?', 'Hayır. Karakterin, eşyaların ve altının sunucuda kalıcı olarak saklanır ve Kick hesabına bağlıdır. Yayıncı oyunu kapatsa da (<code>!svkapat</code>) hiçbir şey silinmez.'],
      ['Ölünce bir şey kaybeder miyim?', 'Hayır. Canın 0 olursa ' + D.rules.ko + ' saniye baygın kalırsın; eşya ya da altın kaybı yoktur. <code>!iyiles</code> ya da iksir baygınlığı hemen bitirir.'],
      ['Neden komutum cevap vermiyor?', 'Büyük ihtimalle bekleme süresindesin; <code>!durum</code> hangi komutun ne zaman hazır olduğunu gösterir. Chat çok yoğunsa yanıtlar kısa bir gecikmeyle gelir.'],
      ['Hangi bölgeye gitmeliyim?', 'Seviyene uygun en yüksek bölge genelde en iyisidir. <code>!harita</code> seviye şartlarını gösterir; zorlanıyorsan bir alt bölgeye dön ve ekipmanını geliştir.'],
      ['Nadir yaratık nasıl yakalarım?', 'Nadir Yaratık Yemi taşı (otomatik kullanılır), Yakalama mesleğini geliştir ve Kızıl Ay olayını kolla: o sırada nadir yaratıklarla karşılaşma ihtimali 2,5 katına çıkar.'],
      ['En hızlı nasıl altın kazanırım?', 'Savaş ve zindanlar düzenli altın verir; nadir malzemeleri pazarda oyunculara satmak genelde tüccardan daha kârlıdır. Görevler ve başarımlar da altın verir. Altın Yağmuru olayında savaş altını 1,5 kat olur.'],
      ['Abone olmak ne sağlar?', 'Aboneler karakter ve meslek EXP\'sini ×1.3, 6 ay ve üzeri aboneler ×1.5 kazanır. Altın ve eşyalar herkes için aynıdır, yani ekonomi adil kalır.'],
      ['Hile yapılabilir mi?', 'Tüm sonuçlar sunucuda hesaplanır; aynı mesaj iki kez işlenmez, takas ve pazar işlemleri ya tamamen olur ya hiç olmaz, her altın ve eşya hareketi kayıt altındadır.'],
    ];
    return '<h2>Sık sorulan sorular</h2><div class="faq">' + Q.map(([q, a]) => '<details><summary>' + q + '</summary><p>' + a + '</p></details>').join('') + '</div>';
  }

  const PAGES = { baslangic: pageBaslangic, komutlar: pageKomutlar, yaratiklar: pageYaratiklar, esyalar: pageEsyalar, tarifler: pageTarifler, bolgeler: pageBolgeler, meslekler: pageMeslekler, zindanlar: pageZindanlar, ilerleme: pageIlerleme, sss: pageSss };

  // ───────── Ayrıntı penceresi ─────────
  const dlg = $('#dlg');
  function openDetail(kind, id) {
    let html = '';
    if (kind === 'esya' && IT[id]) {
      const it = IT[id];
      const stats = it.st ? Object.entries(it.st).map(([k, v]) => '<span class="stat">' + ({ atk: 'ATK', def: 'DEF', maxHp: 'HP' }[k]) + ' +' + v + '</span>').join('') : '';
      html = '<div class="hd" style="--rc:' + RC(it.r) + '"><div class="art">' + itemArt(it) + '</div><div><h3>' + esc(it.n) + '</h3><div class="meta">' + D.rarity[it.r].icon + ' ' + D.rarity[it.r].n + ' · ' + esc(D.cats[it.c]) + (it.slot && it.c !== 'weapon' ? ' · ' + esc(D.slots[it.slot]) : '') + (it.tool ? ' · kademe ' + it.tier : '') + '</div>' + (stats ? '<div style="margin-top:6px">' + stats + (it.heal ? '<span class="stat">+' + (it.heal >= 99999 ? 'tam' : it.heal) + ' can</span>' : '') + '</div>' : it.heal ? '<div style="margin-top:6px"><span class="stat">+' + (it.heal >= 99999 ? 'tam' : it.heal) + ' can</span></div>' : '') + '</div></div>' +
        '<ul>' + it.d.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' + (it.lc.length || it.li.length ? '<p style="margin-bottom:0">' + it.lc.slice(0, 8).map(miniCre).join('') + it.li.slice(0, 10).map((x) => miniItem(x)).join('') + '</p>' : '') +
        '<p class="muted" style="margin-bottom:0">Chat\'te: <code>!esya ' + esc(it.n) + '</code></p>';
    } else if (kind === 'yaratik' && CR[id]) {
      const c = CR[id];
      html = '<div class="hd" style="--rc:' + RC(c.r) + '"><div class="art">' + creArt(c) + '</div><div><h3>' + esc(c.n) + '</h3><div class="meta">' + D.rarity[c.r].icon + ' ' + D.rarity[c.r].n + ' · ' + esc(c.t) + ' · Sv ' + c.lv[0] + '–' + c.lv[1] + '</div><div class="muted" style="font-size:14px">' + REG[c.reg].i + ' ' + esc(REG[c.reg].n) + (c.w ? ' · yakalama ~%' + c.cr : ' · yalnız evrimle') + '</div></div></div>' +
        '<ul>' + c.d.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' + (c.li.length || c.lc.length ? '<p style="margin-bottom:0">' + c.lc.map(miniCre).join('') + c.li.map((x) => miniItem(x)).join('') + '</p>' : '') +
        '<p class="muted" style="margin-bottom:0">Chat\'te: <code>!yaratik ' + esc(c.n) + '</code></p>';
    } else return;
    $('#dlgBody').innerHTML = '<button class="x" aria-label="Kapat" data-close>×</button>' + html;
    $('#dlgBody').scrollTop = 0;
    if (!dlg.open) dlg.showModal();
  }
  dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.closest('[data-close]')) { dlg.close(); } });
  dlg.addEventListener('close', () => { const [p] = location.hash.slice(1).split('/'); if (p === 'esya' || p === 'yaratik') history.replaceState(null, '', '#' + (p === 'esya' ? 'esyalar' : 'yaratiklar')); });

  // ───────── Yönlendirme ─────────
  let current = '';
  function render(page) {
    current = page;
    $('#view').innerHTML = PAGES[page]();
    $('#tabs').querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.p === page));
    const on = $('#tabs a.on');
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  function route() {
    const [p, id] = location.hash.slice(1).split('/');
    if (p === 'esya' || p === 'yaratik') {
      const host = p === 'esya' ? 'esyalar' : 'yaratiklar';
      if (current !== host && !dlg.open) render(host);
      openDetail(p, decodeURIComponent(id || ''));
      return;
    }
    if (dlg.open) dlg.close();
    const page = PAGES[p] ? p : 'baslangic';
    if (page !== current) { render(page); window.scrollTo({ top: 0 }); }
  }
  $('#tabs').innerHTML = TABS.map(([k, l]) => '<a href="#' + k + '" data-p="' + k + '">' + l + '</a>').join('');
  $('#view').addEventListener('click', (e) => {
    const t = e.target.closest('[data-open]');
    if (t) { location.hash = t.dataset.open; return; }
    const f = e.target.closest('[data-f]');
    if (f) { state.f[f.dataset.f] = f.dataset.v; render(current); }
  });
  $('#dlgBody').addEventListener('click', (e) => { const a = e.target.closest('a.mini'); if (a) { e.preventDefault(); location.hash = a.getAttribute('href').slice(1); } });
  $('#view').addEventListener('input', (e) => {
    const k = e.target.dataset.q;
    if (!k) return;
    state.q[k] = e.target.value;
    const pos = e.target.selectionStart;
    render(current);
    const inp = $('#view [data-q="' + k + '"]');
    if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (_) {} }
  });
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
